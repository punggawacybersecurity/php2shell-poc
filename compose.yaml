name: php2shell-lab

x-lab-service: &lab-service
  platform: linux/amd64
  init: true
  pids_limit: 64
  mem_limit: 256m
  cpus: 1.0
  security_opt:
    - no-new-privileges:true
  restart: "no"

services:
  vulnerable:
    <<: *lab-service
    image: php:8.4.26-apache-bookworm@sha256:52f04cd1e398edd0f80afa8330ce73bce61931ddbd0d5bdd919c6f914d02bcf8
    ports:
      - "127.0.0.1:18084:80"
    volumes:
      - ./lab/php.ini:/usr/local/etc/php/conf.d/zz-php2shell-lab.ini:ro
      - ./lab/apache.conf:/etc/apache2/conf-enabled/zz-php2shell-lab.conf:ro
      - ./lab/www:/var/www/html:ro
      - ./artifacts/vulnerable:/out

  patched:
    <<: *lab-service
    image: php:8.4.27-apache-bookworm@sha256:e653ff90d7f6e2e6f81eddb07c864f1eae224ccbf5143f82a44f25e2f110e320
    ports:
      - "127.0.0.1:18085:80"
    volumes:
      - ./lab/php.ini:/usr/local/etc/php/conf.d/zz-php2shell-lab.ini:ro
      - ./lab/apache.conf:/etc/apache2/conf-enabled/zz-php2shell-lab.conf:ro
      - ./lab/www:/var/www/html:ro
      - ./artifacts/patched:/out
